<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>blaude</title>
<style>
  :root { --bg:#0f0f10; --panel:#1a1a1c; --line:#2a2a2e; --fg:#e8e8ea; --dim:#9a9aa2;
          --accent:#d97757; --user:#26262b; --ok:#3fb950; --warn:#e3b341; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; overscroll-behavior:none; }
  header { padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:var(--panel);
           border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
  header .dot.on { background:var(--ok); }
  header h1 { font-size:15px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden;
              text-overflow:ellipsis; }
  header button { background:none; border:none; color:var(--accent); font-size:14px; padding:4px 6px; }
  main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 8px; }
  .row { margin:0 0 12px; max-width:100%; }
  .who { font-size:11px; color:var(--dim); margin-bottom:2px; text-transform:none; }
  .bubble { padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .user .bubble { background:var(--user); }
  .agent .bubble { background:transparent; padding-left:0; padding-right:0; }
  .tool { font-size:12.5px; color:var(--dim); padding:2px 0; }
  .event { font-size:12.5px; color:var(--warn); padding:2px 0; }
  .perm { background:#2b1f16; border:1px solid #7a4a2b; border-radius:12px; padding:12px; margin:10px 0; }
  .perm .t { font-weight:600; margin-bottom:4px; }
  .perm .d { font-size:13px; color:var(--dim); margin-bottom:10px; }
  .perm button { margin-right:8px; padding:8px 14px; border-radius:8px; border:1px solid var(--line);
                 background:var(--panel); color:var(--fg); font-size:14px; }
  .perm button.allow { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row.note { border-left:3px solid #66A5DD; background:#161b22; border-radius:0 10px 10px 0;
              padding:7px 10px; font-size:13px; color:var(--dim); }
  .row.note .nwho { color:#66A5DD; font-weight:600; font-size:11.5px; }
  .vc { font-size:11px; color:var(--dim); margin-left:8px; font-weight:400; }
  .working { color:var(--dim); font-size:13px; padding:4px 0; }
  .working::after { content:"…"; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:0.3; } }
  footer { padding:8px 10px calc(env(safe-area-inset-bottom) + 8px); background:var(--panel);
           border-top:1px solid var(--line); display:flex; gap:8px; align-items:flex-end; }
  footer textarea { flex:1; resize:none; background:var(--bg); color:var(--fg); border:1px solid var(--line);
                    border-radius:10px; padding:9px 12px; font:inherit; max-height:120px; }
  footer button { background:var(--accent); color:#fff; border:none; border-radius:10px;
                  padding:10px 16px; font-size:15px; flex:none; }
  footer button:disabled { opacity:0.4; }
  .gate, .list { padding:20px 16px; }
  .gate h2, .list h2 { font-size:18px; margin-bottom:10px; }
  .gate p { color:var(--dim); font-size:13.5px; margin-bottom:14px; }
  .gate input { width:100%; padding:11px 12px; font:inherit; background:var(--panel); color:var(--fg);
                border:1px solid var(--line); border-radius:10px; margin-bottom:12px; }
  .gate button, .sess { width:100%; text-align:left; }
  .gate button { background:var(--accent); color:#fff; border:none; border-radius:10px;
                 padding:12px; font-size:15px; text-align:center; }
  .sess { display:block; background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:12px 14px; margin-bottom:10px; color:var(--fg); font:inherit; }
  .sess .st { font-size:12px; color:var(--dim); margin-top:2px; }
  .sess.live .st { color:var(--ok); }
  .err { color:#f85149; font-size:13px; margin-top:10px; white-space:pre-wrap; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="dot" id="dot"></div>
  <h1 id="title">blaude</h1>
  <button id="back">Sessions</button>
</header>
<div class="gate" id="gate">
  <h2>blaude</h2>
  <p>Enter this Mac's access token (Invite People shows it, or
     <code>~/.jcode/api-ws-token</code> for the owner).</p>
  <input id="token" type="password" placeholder="access token" autocomplete="current-password">
  <button id="connect">Connect</button>
  <div class="err" id="gateErr"></div>
</div>
<div class="list hidden" id="list"><h2>Sessions</h2><div id="sessions"></div></div>
<main class="hidden" id="chat"></main>
<footer class="hidden" id="composer">
  <textarea id="draft" rows="1" placeholder="Message blaude…"></textarea>
  <button id="send">Send</button>
</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
let ws = null, reqId = 0, pending = new Map(), attached = null, working = false;
let backoff = 500, wantSession = null, savedToken = null;

function show(screen) {
  for (const id of ["gate", "list", "chat", "composer"]) $(id).classList.add("hidden");
  $("hdr").classList.toggle("hidden", screen === "gate");
  if (screen === "chat") { $("chat").classList.remove("hidden"); $("composer").classList.remove("hidden"); }
  else $(screen).classList.remove("hidden");
}
function req(body) {
  return new Promise((resolve, reject) => {
    const id = ++reqId;
    pending.set(id, { resolve, reject });
    ws.send(JSON.stringify({ v: 1, id, ...body }));
  });
}
function notify(body) { ws.send(JSON.stringify({ v: 1, id: ++reqId, ...body })); }

function connect(token) {
  savedToken = token;
  try { localStorage.setItem("blaudeToken", token); } catch (_) {}
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/api?token=${encodeURIComponent(token)}`);
  ws.onopen = async () => {
    backoff = 500;
    $("dot").classList.add("on");
    try {
      await req({ req: "hello", min_version: 1, max_version: 1, client: "blaude-phone/0.1" });
      if (wantSession) attach(wantSession.id, wantSession.title);
      else listSessions();
    } catch (e) { gateFail(String(e)); }
  };
  ws.onmessage = ev => {
    let frame; try { frame = JSON.parse(ev.data); } catch (_) { return; }
    if (frame.reply_to && pending.has(frame.reply_to)) {
      const p = pending.get(frame.reply_to); pending.delete(frame.reply_to);
      if (frame.ev === "error") p.reject(new Error(frame.message || frame.code));
      else p.resolve(frame);
      if (frame.ev === "error" && !attached) return;
    }
    if (!frame.reply_to) onEvent(frame);
  };
  ws.onclose = e => {
    $("dot").classList.remove("on");
    pending.forEach(p => p.reject(new Error("connection closed"))); pending.clear();
    if (e.code === 1006 && !attached && !wantSession) {
      gateFail("Connection refused — check the token."); return;
    }
    setTimeout(() => connect(savedToken), backoff);
    backoff = Math.min(backoff * 2, 10000);
  };
}
function gateFail(msg) { show("gate"); $("gateErr").textContent = msg; }

async function listSessions() {
  wantSession = null; attached = null;
  show("list"); $("title").textContent = "blaude";
  const reply = await req({ req: "list_sessions" });
  const box = $("sessions"); box.innerHTML = "";
  const sessions = (reply.sessions || []).filter(s => !s.archived);
  sessions.sort((a, b) => (live(b) - live(a)) || ((b.transcript_bytes || 0) - (a.transcript_bytes || 0)));
  for (const s of sessions.slice(0, 60)) {
    const b = document.createElement("button");
    b.className = "sess" + (live(s) ? " live" : "");
    const name = document.createElement("div");
    name.textContent = s.title || s.session_id.slice(-16);
    const st = document.createElement("div"); st.className = "st";
    st.textContent = (live(s) ? "● working — " : "") + (s.working_dir || "");
    b.append(name, st);
    b.onclick = () => attach(s.session_id, s.title || "Session");
    box.append(b);
  }
  if (!sessions.length) box.textContent = "No sessions yet — start one on the Mac.";
}
const live = s => s.status === "generating" || s.status === "tool_running" ? 1 : 0;

async function attach(sessionId, title) {
  // One session per connection: reconnect fresh, then attach.
  wantSession = { id: sessionId, title };
  if (attached) { attached = null; ws.onclose = null; ws.close(); connect(savedToken); return; }
  show("chat"); $("chat").innerHTML = ""; $("title").textContent = title;
  try {
    await req({ req: "attach_session", session_id: sessionId });
    attached = sessionId; wantSession = null;
    const h = await req({ req: "get_history", session_id: sessionId });
    $("chat").innerHTML = "";
    for (const m of h.messages || []) {
      if (m.role === "user") row("user", "you", m.content);
      else if (m.role === "assistant") row("agent", "blaude", m.content);
      else if (m.role === "note") noteRow("note", m.content);
      else row("tool", "", m.content.slice(0, 200));
    }
    scroll();
  } catch (e) { row("event", "", "attach failed — " + e.message); }
}

let streamEl = null;
function onEvent(f) {
  // A teammate created a chat. This is about the session LIST, not about one
  // session, so it must be handled before the attached-session filter below,
  // which would drop it whenever the new chat is not the one being viewed.
  if (f.ev === "sessions_changed") {
    if (!attached) listSessions();
    return;
  }
  if (attached && f.session_id && f.session_id !== attached) return;
  switch (f.ev) {
    case "text_delta": setWorking(true); stream(f.text); break;
    case "user_message": streamEl = null; row("user", f.by_user || "teammate", f.content); break;
    case "team_note": noteRow(f.by_user || "teammate", f.content); break;
    case "presence": setViewers(f.viewers || []); break;
    case "tool_start": streamEl = null; setWorking(true); row("tool", "", "▸ " + f.name); break;
    case "tool_done": break;
    case "turn_done": setWorking(false); streamEl = null; break;
    case "message_accepted": setWorking(true); break;
    case "permission_request": permCard(f); break;
    case "permission_resolved": clearPerm(); break;
    case "error": if (f.message !== "daemon connection closed") { setWorking(false); row("event", "", "turn failed — " + (f.message || "")); } break;
  }
}
function stream(text) {
  if (!streamEl) {
    streamEl = row("agent", "blaude", "");
  }
  streamEl.querySelector(".bubble").textContent += text;
  scroll();
}
function noteRow(who, text) {
  const div = document.createElement("div");
  div.className = "row note";
  const w = document.createElement("span"); w.className = "nwho"; w.textContent = who;
  const b = document.createElement("span"); b.textContent = " " + text;
  div.append(w, b);
  $("chat").append(div); scroll();
}
function setViewers(viewers) {
  let el = document.getElementById("viewers");
  if (!el) {
    el = document.createElement("span"); el.id = "viewers"; el.className = "vc";
    document.querySelector("header h1").after(el);
  }
  el.textContent = viewers.length > 1 ? viewers.length + " viewing" : "";
  el.title = viewers.join(", ");
}
function row(kind, who, text) {
  const div = document.createElement("div"); div.className = "row " + kind;
  if (kind === "user" || kind === "agent") {
    if (who) { const w = document.createElement("div"); w.className = "who"; w.textContent = who; div.append(w); }
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = text; div.append(b);
  } else {
    div.classList.add(kind); div.textContent = text;
  }
  $("chat").append(div); scroll();
  return div;
}
let workEl = null;
function setWorking(on) {
  working = on;
  if (on && !workEl) { workEl = document.createElement("div"); workEl.className = "working"; workEl.textContent = "working"; $("chat").append(workEl); scroll(); }
  if (!on && workEl) { workEl.remove(); workEl = null; }
}
let permEl = null;
function permCard(f) {
  clearPerm();
  permEl = document.createElement("div"); permEl.className = "perm";
  const t = document.createElement("div"); t.className = "t"; t.textContent = f.tool_name || "permission";
  const d = document.createElement("div"); d.className = "d"; d.textContent = f.description || "";
  permEl.append(t, d);
  for (const [label, decision, cls] of [["Allow", "allow", "allow"], ["Always", "allow_always", ""], ["Deny", "deny", ""]]) {
    const b = document.createElement("button"); b.textContent = label; b.className = cls;
    b.onclick = () => notify({ req: "permission_response", session_id: attached, request_id: f.request_id, decision });
    permEl.append(b);
  }
  $("chat").append(permEl); scroll();
}
function clearPerm() { if (permEl) { permEl.remove(); permEl = null; } }
function scroll() { requestAnimationFrame(() => { $("chat").scrollTop = $("chat").scrollHeight; }); }

$("send").onclick = () => {
  const text = $("draft").value.trim();
  if (!text || !attached) return;
  $("draft").value = "";
  streamEl = null;
  row("user", "you", text);
  if (working) notify({ req: "soft_interrupt", session_id: attached, content: text, urgent: false });
  else { notify({ req: "send_message", session_id: attached, content: text }); setWorking(true); }
};
$("draft").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").onclick(); }
});
$("back").onclick = () => { attached = null; wantSession = null; ws.onclose = null; ws.close(); connect(savedToken); };
$("connect").onclick = () => {
  const t = $("token").value.trim();
  if (t) { $("gateErr").textContent = ""; connect(t); }
};
try {
  const stored = localStorage.getItem("blaudeToken");
  if (stored) { $("token").value = stored; connect(stored); }
} catch (_) {}
</script>
</body>
</html>
