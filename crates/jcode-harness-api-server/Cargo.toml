[package]
name = "jcode-harness-api-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Harness API endpoint: bridges versioned API clients onto the internal jcode protocol"

[dependencies]
anyhow = "1"
futures = "0.3"
# Permission prompts are file-mediated between two PROCESSES (daemon and
# bridge), so the filesystem is the channel: a watch turns a 900ms poll into an
# OS-delivered event. Same crate the gitnexus reindex watcher uses.
notify = "6"
jcode-harness-api = { path = "../jcode-harness-api" }
jcode-storage = { path = "../jcode-storage" }
jcode-transport = { path = "../jcode-transport" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-pemfile = "2"
# Clerk invitation emails are sent BRIDGE-side so the app never holds the
# secret (it lives in ~/.jcode/clerk.env, owner-only).
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "rustls-tls", "rustls-tls-native-roots"] }
# The provider OAuth exchange (login_jobs) runs BRIDGE-side so the token never
# crosses the wire and a remote team server logs into its OWN account store.
# The product binary (`blaude api-bridge`) already links jcode-base; only the
# dev-side standalone `jcode-harness-api-bridge` binary grows from this.
jcode-base = { path = "../jcode-base", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Scratch JCODE_HOME for the join-ticket tests, so they never read or
# write the developer's real ticket store.
tempfile = "3"
# The parser in `background_progress` reads markdown produced by the daemon's
# own formatter, so the contract test builds that formatter rather than a copy
# of its output: a change to the wire prose then fails here instead of silently
# turning every client's progress bar off.
jcode-background-types = { path = "../jcode-background-types" }
# Self-signed certs for the wss round-trip test — pure Rust, dev-only.
rcgen = "0.13"

[[bin]]
name = "jcode-harness-api-bridge"
path = "src/bin/bridge.rs"
