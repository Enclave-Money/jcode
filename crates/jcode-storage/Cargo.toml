[package]
name = "jcode-storage"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Makes the home resolvers (jcode_dir/app_config_dir/user_home_path) consult
# jcode-core's per-thread JCODE_HOME override so parallel tests stay isolated.
# Forwards to jcode-core's matching feature. Never in normal (non-test) builds.
test-support = ["jcode-core/test-support"]

[dependencies]
anyhow = "1"
dirs = "5"
jcode-core = { path = "../jcode-core" }
libc = "0.2"
rand = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
